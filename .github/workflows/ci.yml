name: Placement Nexus CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Validate & Type-check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: placementnexus
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: placement_nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U placementnexus -d placement_nexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: "postgresql://placementnexus:ci_test_password@localhost:5432/placement_nexus_test?schema=public"
      JWT_ACCESS_SECRET: "ci_test_jwt_access_secret_must_be_at_least_32_chars"
      JWT_REFRESH_SECRET: "ci_test_jwt_refresh_secret_must_be_at_least_32_chars"
      JWT_ACCESS_EXPIRY: "15m"
      JWT_REFRESH_EXPIRY: "7d"
      AI_INTERNAL_KEY: "ci_test_ai_internal_key"
      CORS_ORIGIN: "http://localhost:5173"
      NODE_ENV: "test"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: TypeScript type-check (no emit)
        run: npx tsc --noEmit

  # ─── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Build & Type-check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (type-check + bundle)
        run: npm run build
        env:
          # Ensure no secrets are needed at build time
          NODE_ENV: production

  # ─── Python AI Service ────────────────────────────────────────────────────────
  ai-service:
    name: AI Service — Syntax & Compile Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python syntax check (compile all modules)
        run: python -m compileall app -q

      - name: Run existing AI unit tests
        env:
          AI_PROVIDER: mock
          AI_INTERNAL_KEY: ci_test_internal_key
        run: python -m pytest test_ai.py -v --tb=short || python test_ai.py
