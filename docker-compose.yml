version: '3.8'

# ─── Placement Nexus Production Compose ───────────────────────────────────────
#
# Required environment variables (set in a .env file or CI secrets):
#
#   POSTGRES_PASSWORD      — PostgreSQL superuser password (required, strong)
#   JWT_ACCESS_SECRET      — 64-hex-char JWT access secret
#   JWT_REFRESH_SECRET     — 64-hex-char JWT refresh secret
#   CORS_ORIGIN            — Comma-separated list of allowed frontend origins
#   AI_INTERNAL_KEY        — Service-to-service shared key (backend ↔ ai-service)
#   AI_PROVIDER            — "mock" or "gemini"
#   AI_GEMINI_API_KEY      — Gemini API key (only if AI_PROVIDER=gemini)
#
# Generate secrets:
#   node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"

services:
  postgres:
    image: postgres:16-alpine
    container_name: placement_nexus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: placementnexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: placement_nexus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Do NOT expose 5432 to the public network; only internal services need it
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placementnexus -d placement_nexus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: placement_nexus_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://placementnexus:${POSTGRES_PASSWORD}@postgres:5432/placement_nexus?schema=public"
      PORT: "5000"
      NODE_ENV: "production"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: "15m"
      JWT_REFRESH_EXPIRY: "7d"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      AI_SERVICE_URL: "http://ai-service:8000"
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: placement_nexus_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - internal

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      target: production
    container_name: placement_nexus_ai_service
    restart: unless-stopped
    environment:
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_GEMINI_API_KEY: ${AI_GEMINI_API_KEY:-}
      NODE_ENV: "production"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - internal

volumes:
  postgres_data:
    driver: local

networks:
  internal:
    driver: bridge
