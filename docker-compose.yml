version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: placement_nexus_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: placement_nexus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placement_nexus_backend
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgresql://postgres:root@postgres:5432/placement_nexus?schema=public"
      PORT: 5000
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: placement_nexus_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: placement_nexus_ai_service
    restart: always
    ports:
      - "8000:8000"

volumes:
  postgres_data:
